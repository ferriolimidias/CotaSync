# Instalar em /etc/nginx/sites-available/desktop-cotasync.ferriolimidias.com.br.
# O cookie leva a autorizacao da pagina inicial para assets e para o WebSocket.
map $arg_token $cotasync_desktop_view_token {
    ""      $cookie_cotasync_desktop_view;
    default $arg_token;
}

map $arg_token $cotasync_desktop_view_cookie {
    ""      "";
    default "cotasync_desktop_view=$arg_token; Path=/; Max-Age=1800; Secure; HttpOnly; SameSite=Strict";
}

server {
    listen 80;
    listen [::]:80;
    server_name desktop-cotasync.ferriolimidias.com.br;

    location = / {
        return 302 https://cotasync.ferriolimidias.com.br;
    }

    location = /_desktop_view_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Header evita que o segredo apareca na URL do access log do backend.
        proxy_set_header X-Desktop-View-Token $cotasync_desktop_view_auth_token;
        proxy_pass http://127.0.0.1:8100/api/v1/browser/validate-view-token;
    }

    location / {
        # Captura o token no request principal antes de criar o subrequest interno.
        set $cotasync_desktop_view_auth_token $cotasync_desktop_view_token;
        auth_request /_desktop_view_auth;
        # $uri descarta a query antes do websockify; o navegador ainda a usa para configurar noVNC.
        proxy_pass http://127.0.0.1:3200$uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_send_timeout 600;

        add_header Set-Cookie $cotasync_desktop_view_cookie always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # URLs com token nao podem ser gravadas em claro.
    access_log off;
}
