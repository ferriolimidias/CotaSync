# Orquestracao CotaSync: FastAPI + Streamlit + Desktop Browser + PostgreSQL.
# Ajuste variaveis em `.env` antes de subir em ambiente operacional.

services:
  desktop_browser:
    build:
      context: .
      dockerfile: desktop-browser/Dockerfile
    environment:
      DESKTOP_BROWSER_PROFILE_DIR: ${DESKTOP_BROWSER_PROFILE_DIR:-/data/profile}
    ports:
      - "127.0.0.1:${DESKTOP_BROWSER_VIEW_PORT:-3200}:6080"
      - "127.0.0.1:${DESKTOP_BROWSER_CDP_PORT:-9222}:9222"
    volumes:
      - cotasync_desktop_browser_profile:${DESKTOP_BROWSER_PROFILE_DIR:-/data/profile}
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9222/json/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cotasync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cotasync_password}
      POSTGRES_DB: ${POSTGRES_DB:-cotasync}
    volumes:
      - cotasync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cotasync} -d ${POSTGRES_DB:-cotasync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cotasync_app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      desktop_browser:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      COTASYNC_BROWSER_MODE: desktop_browser
      DESKTOP_BROWSER_CDP_URL: ${DESKTOP_BROWSER_CDP_URL:-http://desktop_browser:9222}
      DESKTOP_BROWSER_VIEW_URL: ${DESKTOP_BROWSER_VIEW_URL:-http://127.0.0.1:3200/vnc.html?autoconnect=1&resize=scale}
      COTASYNC_DEMO_TARGET_URL: http://cotasync_app:8000/demo/alvo
      DATABASE_URL: postgresql://${POSTGRES_USER:-cotasync}:${POSTGRES_PASSWORD:-cotasync_password}@postgres:5432/${POSTGRES_DB:-cotasync}
    restart: unless-stopped

volumes:
  cotasync_postgres_data:
  cotasync_desktop_browser_profile:
