name: cotasync_test

services:
  cotasync_test_desktop_browser:
    build:
      context: .
      dockerfile: desktop-browser/Dockerfile
    container_name: cotasync_test_desktop_browser
    environment:
      DESKTOP_BROWSER_PROFILE_DIR: ${DESKTOP_BROWSER_PROFILE_DIR:-/data/profile}
    ports:
      - "127.0.0.1:${DESKTOP_BROWSER_VIEW_PORT:-3200}:6080"
      - "127.0.0.1:${DESKTOP_BROWSER_CDP_PORT:-9222}:9222"
    volumes:
      - cotasync_test_desktop_browser_profile:${DESKTOP_BROWSER_PROFILE_DIR:-/data/profile}
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9222/json/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - cotasync_test_net
    restart: unless-stopped

  cotasync_test_postgres:
    image: postgres:15-alpine
    container_name: cotasync_test_postgres
    environment:
      POSTGRES_USER: cotasync_test
      POSTGRES_PASSWORD: cotasync_test_password
      POSTGRES_DB: cotasync_test
    volumes:
      - cotasync_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotasync_test -d cotasync_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cotasync_test_net
    restart: unless-stopped

  cotasync_test_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotasync_test_backend
    command: backend
    depends_on:
      cotasync_test_desktop_browser:
        condition: service_healthy
      cotasync_test_postgres:
        condition: service_healthy
    env_file:
      - .env.test
    environment:
      COTASYNC_BROWSER_MODE: desktop_browser
      DESKTOP_BROWSER_CDP_URL: ${DESKTOP_BROWSER_CDP_URL:-http://cotasync_test_desktop_browser:9222}
      DESKTOP_BROWSER_VIEW_URL: ${DESKTOP_BROWSER_VIEW_URL:-http://127.0.0.1:3200/vnc.html?autoconnect=1&resize=scale}
      DESKTOP_BROWSER_PROFILE_DIR: ${DESKTOP_BROWSER_PROFILE_DIR:-/data/profile}
      COTASYNC_PUBLIC_BASE_URL: ${COTASYNC_PUBLIC_BASE_URL:-http://127.0.0.1:3100}
      COTASYNC_DESKTOP_VIEW_PUBLIC_BASE_URL: ${COTASYNC_DESKTOP_VIEW_PUBLIC_BASE_URL:-}
      COTASYNC_DESKTOP_VIEW_TOKEN_TTL_SECONDS: ${COTASYNC_DESKTOP_VIEW_TOKEN_TTL_SECONDS:-1800}
      COTASYNC_DEMO_TARGET_URL: http://cotasync_test_backend:8000/demo/alvo
      DATABASE_URL: postgresql://cotasync_test:cotasync_test_password@cotasync_test_postgres:5432/cotasync_test
      COTASYNC_COOKIE_SECURE: ${COTASYNC_COOKIE_SECURE:-false}
      COTASYNC_SESSION_SECRET: ${COTASYNC_SESSION_SECRET:-cotasync-test-session-secret-change-me}
      COTASYNC_ADMIN_USERNAME: ${COTASYNC_ADMIN_USERNAME:-admin}
      COTASYNC_ADMIN_PASSWORD: ${COTASYNC_ADMIN_PASSWORD:-admin-test-password}
      COTASYNC_OPERATOR_USERNAME: ${COTASYNC_OPERATOR_USERNAME:-operator}
      COTASYNC_OPERATOR_PASSWORD: ${COTASYNC_OPERATOR_PASSWORD:-operator-test-password}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8100}:8000"
    volumes:
      - .:/app
    networks:
      - cotasync_test_net
    restart: unless-stopped

  cotasync_test_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotasync_test_worker
    command: worker
    depends_on:
      cotasync_test_desktop_browser:
        condition: service_healthy
      cotasync_test_postgres:
        condition: service_healthy
    env_file:
      - .env.test
    environment:
      COTASYNC_BROWSER_MODE: desktop_browser
      DESKTOP_BROWSER_CDP_URL: ${DESKTOP_BROWSER_CDP_URL:-http://cotasync_test_desktop_browser:9222}
      DESKTOP_BROWSER_VIEW_URL: ${DESKTOP_BROWSER_VIEW_URL:-http://127.0.0.1:3200/vnc.html?autoconnect=1&resize=scale}
      DESKTOP_BROWSER_PROFILE_DIR: ${DESKTOP_BROWSER_PROFILE_DIR:-/data/profile}
      COTASYNC_DEMO_TARGET_URL: http://cotasync_test_backend:8000/demo/alvo
      DATABASE_URL: postgresql://cotasync_test:cotasync_test_password@cotasync_test_postgres:5432/cotasync_test
      COTASYNC_WORKER_HEARTBEAT_SECONDS: ${COTASYNC_WORKER_HEARTBEAT_SECONDS:-10}
      COTASYNC_WORKER_STALE_SECONDS: ${COTASYNC_WORKER_STALE_SECONDS:-60}
      COTASYNC_ENABLE_SLOW_FIXTURE: ${COTASYNC_ENABLE_SLOW_FIXTURE:-false}
    volumes:
      - .:/app
    networks:
      - cotasync_test_net
    restart: unless-stopped

  cotasync_test_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotasync_test_frontend
    command: frontend
    depends_on:
      cotasync_test_backend:
        condition: service_started
    env_file:
      - .env.test
    environment:
      COTASYNC_BROWSER_MODE: desktop_browser
      DESKTOP_BROWSER_CDP_URL: ${DESKTOP_BROWSER_CDP_URL:-http://cotasync_test_desktop_browser:9222}
      DESKTOP_BROWSER_VIEW_URL: ${DESKTOP_BROWSER_VIEW_URL:-http://127.0.0.1:3200/vnc.html?autoconnect=1&resize=scale}
      DESKTOP_BROWSER_PROFILE_DIR: ${DESKTOP_BROWSER_PROFILE_DIR:-/data/profile}
      BACKEND_URL: http://cotasync_test_backend:8000
      COTASYNC_API_BASE_URL: http://cotasync_test_backend:8000
      COTASYNC_PUBLIC_BASE_URL: ${COTASYNC_PUBLIC_BASE_URL:-http://127.0.0.1:3100}
      COTASYNC_DESKTOP_VIEW_PUBLIC_BASE_URL: ${COTASYNC_DESKTOP_VIEW_PUBLIC_BASE_URL:-}
      DATABASE_URL: postgresql://cotasync_test:cotasync_test_password@cotasync_test_postgres:5432/cotasync_test
      COTASYNC_COOKIE_SECURE: ${COTASYNC_COOKIE_SECURE:-false}
      COTASYNC_ADMIN_USERNAME: ${COTASYNC_ADMIN_USERNAME:-admin}
      COTASYNC_ADMIN_PASSWORD: ${COTASYNC_ADMIN_PASSWORD:-admin-test-password}
      COTASYNC_OPERATOR_USERNAME: ${COTASYNC_OPERATOR_USERNAME:-operator}
      COTASYNC_OPERATOR_PASSWORD: ${COTASYNC_OPERATOR_PASSWORD:-operator-test-password}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:8501"
    volumes:
      - .:/app
    networks:
      - cotasync_test_net
    restart: unless-stopped

networks:
  cotasync_test_net:
    name: cotasync_test_net

volumes:
  cotasync_test_postgres_data:
    name: cotasync_test_postgres_data
  cotasync_test_desktop_browser_profile:
    name: cotasync_test_desktop_browser_profile
